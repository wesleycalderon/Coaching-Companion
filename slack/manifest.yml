# Slack app manifest for the Coaching companion prototype.
# Create the app at https://api.slack.com/apps → Create New App → From an app manifest,
# pick a TEST workspace, and paste this file. Synthetic data only.
display_information:
  name: Coaching companion (prototype)
  description: AI coaching companion that helps you keep the actions you agree with your coach. Prototype with synthetic data.
  background_color: "#24282b"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Coaching companion
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write        # send recaps, nudges and check-ins
      - im:write          # open the direct message with the coachee
      - users:read        # look people up
      - users:read.email  # match coachees to Slack accounts by email
settings:
  interactivity:
    is_enabled: true      # buttons and forms in the companion's messages
  org_deploy_enabled: false
  socket_mode_enabled: true  # no public URL needed
  token_rotation_enabled: false
